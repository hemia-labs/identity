name: Identity CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_call:
    inputs:
      preserve_images:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: identity-ci-${{ inputs.preserve_images && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Test Identity and its production images
        run: bash scripts/identity-checks.sh
      - name: Preserve validated images for the release job
        if: inputs.preserve_images
        run: |
          mkdir -p "$RUNNER_TEMP/identity-images"
          docker save hemia-identity-backend:local hemia-identity-frontend:local -o "$RUNNER_TEMP/identity-images/images.tar"
      - name: Upload the exact validated images
        if: inputs.preserve_images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: identity-images
          path: ${{ runner.temp }}/identity-images/images.tar
          compression-level: 0
          retention-days: 2
