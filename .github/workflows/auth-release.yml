name: auth-release.yml

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: auth-release-main
  cancel-in-progress: false
  queue: max

jobs:
  classify:
    if: github.repository == 'hemia-labs/identity' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.batch.outputs.release }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identify a reviewed version-only merge
        id: batch
        env:
          BASE_SHA: ${{ github.event.before }}
        run: node scripts/auth-release.mjs classify "$BASE_SHA"

  version-pr:
    needs: [classify, validate]
    if: needs.classify.outputs.release != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Check for pending public releases
        id: changesets
        run: |
          bun run changeset status --output "$RUNNER_TEMP/changeset-status.json"
          node -e "const s=require(process.env.RUNNER_TEMP+'/changeset-status.json'); require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'pending='+(s.releases.some(r=>r.name==='@hemia/auth'))+'\n')"
      - name: Create a GitHub App token when configured
        id: app-token
        if: steps.changesets.outputs.pending == 'true' && vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: identity
          permission-contents: write
          permission-pull-requests: write
      - name: Prepare the Auth version and changelog
        if: steps.changesets.outputs.pending == 'true'
        run: |
          bun run version:auth
          node scripts/auth-release.mjs notes > "$RUNNER_TEMP/auth-release-notes.md"
      - name: Create or update the Auth version PR
        if: steps.changesets.outputs.pending == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          base: main
          branch: changeset-release/auth
          title: 'chore(auth): release package versions'
          commit-message: 'chore(auth): release package versions'
          body-path: ${{ runner.temp }}/auth-release-notes.md
          add-paths: |
            packages/auth/package.json
            packages/auth/CHANGELOG.md
            bun.lock
            .changeset/*.md

  validate:
    needs: classify
    uses: ./.github/workflows/package-auth.yml
    with:
      preserve-release-artifact: ${{ needs.classify.outputs.release == 'true' }}

  publish:
    needs: [classify, validate]
    if: needs.classify.outputs.release == 'true' && vars.ENABLE_NPM_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.15.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: auth-release
          path: ${{ runner.temp }}/auth-release
      - name: Publish verified npm package and create GitHub Release
        env:
          ENABLE_NPM_PUBLISH: ${{ vars.ENABLE_NPM_PUBLISH }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/auth-release.mjs publish "$RUNNER_TEMP/auth-release"
