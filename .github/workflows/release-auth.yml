name: Auth releases

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: auth-release-develop
  cancel-in-progress: false
  queue: max

jobs:
  classify:
    if: github.repository == 'hemia-labs/identity' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.batch.outputs.release }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identify a reviewed version-only merge
        id: batch
        env:
          BASE_SHA: ${{ github.event.before }}
        run: node scripts/auth-release.mjs classify "$BASE_SHA"

  version-pr:
    needs: classify
    if: needs.classify.outputs.release != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Check for pending public releases
        id: changesets
        run: |
          bun run changeset status --output "$RUNNER_TEMP/changeset-status.json"
          node -e "const s=require(process.env.RUNNER_TEMP+'/changeset-status.json'); require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'pending='+(s.releases.some(r=>r.name==='@hemia/auth'))+'\n')"
      - name: Create a GitHub App token when configured
        id: app-token
        if: steps.changesets.outputs.pending == 'true' && vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: identity
          permission-contents: write
          permission-pull-requests: write
      - name: Create or update the version PR
        if: steps.changesets.outputs.pending == 'true'
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1 for Changesets CLI 2
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          version: bun run version:auth
          title: 'chore(auth): release package versions'
          commit: 'chore(auth): release package versions'
          commitMode: github-api
          createGithubReleases: false

  validate:
    needs: classify
    if: needs.classify.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: node --test test/release/auth-release.test.mjs
      - run: bun run --cwd packages/auth typecheck
      - run: bun run --cwd packages/auth test
      - run: bun run --cwd packages/auth build
      - run: node test/auth/package/built-nestjs.cjs
      - name: Validate and preserve the npm tarball
        env:
          AUTH_RELEASE_DIR: ${{ runner.temp }}/auth-release
        run: node test/auth/package/check-auth-tarball.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: auth-release
          path: ${{ runner.temp }}/auth-release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [classify, validate]
    if: needs.classify.outputs.release == 'true' && vars.ENABLE_NPM_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.15.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: auth-release
          path: ${{ runner.temp }}/auth-release
      - name: Publish only an unpublished, validated version
        env:
          ENABLE_NPM_PUBLISH: ${{ vars.ENABLE_NPM_PUBLISH }}
        run: node scripts/auth-release.mjs publish "$RUNNER_TEMP/auth-release"
