server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Inherited by every proxied location below.
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Backend routes (nest global prefix + the paths excluded from it).
  location /api/v1/      { proxy_pass http://backend:4000; }
  location /oauth/       { proxy_pass http://backend:4000; }
  location /oidc/        { proxy_pass http://backend:4000; }
  location /.well-known/ { proxy_pass http://backend:4000; }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
