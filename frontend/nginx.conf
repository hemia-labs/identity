worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 512;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Only trusted gateway/host proxies should reach the published port.
  map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    http http;
    https https;
  }

  # Docker DNS refreshes the upstream when the backend is recreated.
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream identity_backend {
    zone identity_backend 64k;
    server backend:4000 resolve;
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    location = /healthz { access_log off; return 200 "ok\n"; }
    location /api/v1/      { proxy_pass http://identity_backend; }
    location /oauth/       { proxy_pass http://identity_backend; }
    location /oidc/        { proxy_pass http://identity_backend; }
    location /.well-known/ { proxy_pass http://identity_backend; }

    location /assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-store";
    }
  }
}
