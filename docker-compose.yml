services:
  postgres:
    image: postgres:16-alpine
    container_name: hemia-id-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: hemia
      POSTGRES_PASSWORD: hemia
      POSTGRES_DB: hemia_id
    volumes:
      - hemia_id_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hemia -d hemia_id"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hemia-id-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hemia_id_postgres_data:
