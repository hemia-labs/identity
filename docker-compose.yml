services:
  backend:
    build:
      context: ./backend
      target: runtime
    container_name: hemia-id-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "4000:4000"
    # Postgres and Redis run on the host, outside Docker. host.docker.internal resolves to the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      target: runtime
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: hemia-id-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
